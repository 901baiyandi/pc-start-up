<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07090f">
  <title>PC Start-Up</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <div class="brand-name">PC Start-Up</div>
          <div class="brand-sub" id="pcName">Oyun bilgisayarın</div>
        </div>
      </div>
      <button class="status-chip" id="statusChip" data-state="unknown" aria-label="Bilgisayar durumu">
        <span class="dot"></span><span class="label">Kontrol ediliyor</span>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Ayarlar"></button>
    </header>

    <main id="main">
      <section id="setupCard" class="setup-card" hidden></section>
      <section id="hero" class="hero"></section>
      <section id="powerBar" class="power-bar"></section>

      <section class="library">
        <div class="section-head">
          <div>
            <h2>Kütüphane</h2>
            <span class="count" id="gameCount"></span>
          </div>
          <button class="pill-btn" id="addGameBtn"></button>
        </div>
        <div id="grid" class="grid"></div>
      </section>
      <footer class="foot">Aynı Wi-Fi ağında olmalısın · Ajan portu <span id="footPort">5757</span></footer>
    </main>
  </div>

  <!-- Alttan açılan paneller -->
  <div id="scrim" class="scrim"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true"><div class="sheet-grip"></div><div id="sheetBody"></div></div>

  <!-- Başlatma ekranı -->
  <div id="launch" class="launch" hidden></div>

  <div id="toast" class="toast"></div>
  <input type="file" id="filePick" accept="image/*" hidden>

  <script src="app.js"></script>
</body>
</html>
